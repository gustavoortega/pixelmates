# CI workflow for pixelmates

name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        id: install_dependencies
        run: npm ci

      # --- Protocol spec checks (blocking) ---

      - name: Validate AsyncAPI spec
        id: validate_spec
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run asyncapi:validate
        continue-on-error: true

      - name: Generated messages drift check
        id: messages_drift
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run asyncapi:generate
          if ! git diff --exit-code core/src/messages.ts; then
            echo "::error::core/src/messages.ts is out of sync with core/asyncapi.yaml. Run 'npm run asyncapi:generate' locally and commit the result."
            exit 1
          fi
        continue-on-error: true

      - name: E2E inventory drift check
        id: e2e_inventory_drift
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run e2e:inventory
          if ! git diff --exit-code e2e/README.md; then
            echo "::error::e2e/README.md inventory is out of sync with the test suite. Run 'npm run e2e:inventory' locally and commit the result."
            exit 1
          fi
        continue-on-error: true

      - name: Memory MCP bundle drift check
        id: memory_bundle_drift
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run plugin:build
          if ! git diff --exit-code plugin/; then
            echo "::error::plugin/ is out of sync with server/src/memory or package.json. Run 'npm run plugin:build' locally and commit the result."
            exit 1
          fi
        continue-on-error: true

      # --- Quality Checks (blocking) ---

      - name: Type Check
        id: type_check
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run check-types
        continue-on-error: true

      - name: Lint
        id: lint
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run lint
        continue-on-error: true

      - name: Webview Tests
        id: webview_test
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run test -w webview-ui
        continue-on-error: true

      - name: Format Check
        id: format_check
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run format:check
        continue-on-error: true

      - name: Knip (advisory)
        id: knip
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm run knip
        continue-on-error: true

      # --- Build (blocking) ---

      - name: Build
        id: build
        if: always() && steps.install_dependencies.outcome == 'success'
        run: |
          npm run build:extension
          npm run build:webview
        continue-on-error: true

      - name: Verify npm Package Artifact
        id: npm_package
        if: always() && steps.build.outcome == 'success' && steps.install_dependencies.outcome == 'success'
        run: npm run test:package-contract && npm run verify:npm-package -- --skip-build
        continue-on-error: true

      # --- Server Tests (require build for hook script) ---

      - name: Server Tests
        id: server_test
        if: always() && steps.build.outcome == 'success' && steps.install_dependencies.outcome == 'success'
        run: npm run test -w server
        continue-on-error: true

      # --- Audit Checks (blocking) ---

      - name: Audit Dependencies
        id: audit
        if: always() && steps.install_dependencies.outcome == 'success'
        run: npm audit --audit-level=moderate --workspaces --include-workspace-root
        continue-on-error: true

      # --- Summary ---

      - name: Write Step Summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEBVIEW_TEST: ${{ steps.webview_test.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NPM_PACKAGE: ${{ steps.npm_package.outcome }}
          MEMORY_BUNDLE_DRIFT: ${{ steps.memory_bundle_drift.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          KNIP: ${{ steps.knip.outcome }}
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "❌ FAIL"; fi
          }
          advisory() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "⚠️ WARN"; fi
          }
          {
            echo "## CI Results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Checkout | $(status "$CHECKOUT") |"
            echo "| Setup Node | $(status "$SETUP_NODE") |"
            echo "| Install dependencies | $(status "$INSTALL_DEPENDENCIES") |"
            echo "| **Type check** | $(status "$TYPE_CHECK") |"
            echo "| **Lint** | $(status "$LINT") |"
            echo "| **Webview tests** | $(status "$WEBVIEW_TEST") |"
            echo "| **Format check** | $(status "$FORMAT_CHECK") |"
            echo "| **Build** | $(status "$BUILD") |"
            echo "| **Memory MCP bundle current** | $(status "$MEMORY_BUNDLE_DRIFT") |"
            echo "| **npm package artifact** | $(status "$NPM_PACKAGE") |"
            echo "| **Server tests** | $(status "$SERVER_TEST") |"
            echo "| Audit dependencies _(advisory)_ | $(advisory "$AUDIT") |"
            echo "| Knip _(advisory)_ | $(advisory "$KNIP") |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Final Gate ---

      - name: Fail If Any Blocking Check Failed
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEBVIEW_TEST: ${{ steps.webview_test.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NPM_PACKAGE: ${{ steps.npm_package.outcome }}
          MEMORY_BUNDLE_DRIFT: ${{ steps.memory_bundle_drift.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
        run: |
          failed=0
          for step in CHECKOUT SETUP_NODE INSTALL_DEPENDENCIES \
                      TYPE_CHECK LINT \
                      WEBVIEW_TEST FORMAT_CHECK BUILD NPM_PACKAGE SERVER_TEST \
                      MEMORY_BUNDLE_DRIFT; do
            val=$(printenv "$step" 2>/dev/null || echo "skipped")
            if [ "$val" != "success" ]; then
              echo "::error::$step failed"
              failed=1
            fi
          done
          exit "$failed"

  npm-package-node22:
    name: npm Package Smoke (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify npm Package Contract and Installed Artifact
        run: npm run test:package-contract && npm run verify:npm-package

  e2e:
    name: Standalone E2E
    # The standalone Playwright project only: the real CLI served to a headless browser. The VS Code
    # specs (e2e/tests/claude) need an editor and stay a local-only suite.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build:extension

      - name: Build Webview
        run: npm run build:webview

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Standalone E2E Tests
        run: npm run e2e:standalone

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/e2e
            test-results/e2e

  # Single aggregate status check to require in branch protection, instead of
  # pinning every job/shard name (which silently breaks when a shard is renamed
  # or the job list changes). Green only when ci, npm-package-node22 and e2e succeed.
  required-checks:
    name: Required Checks
    if: always()
    needs:
      - ci
      - npm-package-node22
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "ci=${{ needs.ci.result }}"
          echo "npm-package-node22=${{ needs.npm-package-node22.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.ci.result }}" != "success" ] \
            || [ "${{ needs.npm-package-node22.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more required jobs did not succeed"
            exit 1
          fi
          echo "All required jobs succeeded."
